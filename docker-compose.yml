version: '3.8'

services:
  antigravity-line-bot:
    build: .
    container_name: antigravity_line_bot
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
